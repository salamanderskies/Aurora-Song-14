# NF bulbs
- type: entity
  id: PoweredSmallFloorLightSodium
  suffix: Sodium
  parent: PoweredSmallFloorLight
  components:
  - type: PointLight
    enabled: true
    energy: 1.0
    radius: 6
    softness: 1.1
    color: "#FFAF38"
  - type: PoweredLight
    hasLampOnSpawn: SodiumLightBulb
  - type: Construction
    graph: FloorLightFixture
    node: smallFloorLightSodium
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand

