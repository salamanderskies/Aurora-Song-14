#AS tubes
- type: entity
  id: PoweredFloorLightBlueLed
  suffix: BlueLED
  parent: PoweredFloorLight
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Lighting/floorlights.rsi
    layers:
    - map: [ "enum.PoweredLightLayers.Base" ]
      state: blue
    - map: [ "enum.PoweredLightLayers.Glow" ]
      state: blueGlow
      shader: unshaded
  - type: PoweredLightVisuals
    blinkingSound:
      path: "/Audio/Machines/light_tube_on.ogg"
    spriteStateMap:
      off: blue
      on: blue
      broken: broken
      burned: burned
  - type: PoweredLight
    hasLampOnSpawn: BlueLedLightTube
  - type: PointLight
    radius: 8
    energy: 3
    softness: 0.5
    color: "#0000FFFF"
  - type: Construction
    graph: FloorLightFixture
    node: floorLightBlueLed
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand

- type: entity
  id: PoweredFloorLightMagentaLed
  suffix: MagentaLED
  parent: PoweredFloorLight
  components:
  - type: Sprite
    sprite: _Impstation/Structures/Lighting/floorlights.rsi
    layers:
    - map: [ "enum.PoweredLightLayers.Base" ]
      state: uv
    - map: [ "enum.PoweredLightLayers.Glow" ]
      state: uvGlow
      shader: unshaded
  - type: PoweredLightVisuals
    blinkingSound:
      path: "/Audio/Machines/light_tube_on.ogg"
    spriteStateMap:
      off: uv
      on: uv
      broken: broken
      burned: burned
  - type: PoweredLight
    hasLampOnSpawn: MagentaLedLightTube
  - type: PointLight
    radius: 8
    energy: 3
    softness: 0.5
    color: "#FF00FF"
  - type: Construction
    graph: FloorLightFixture
    node: floorLightMagentaLed
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand
